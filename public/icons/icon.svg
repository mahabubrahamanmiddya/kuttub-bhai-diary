<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" />
  
  <!-- Book / Diary Base -->
  <rect x="96" y="80" width="320" height="352" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="8" />
  
  <!-- Diary Spine -->
  <rect x="96" y="80" width="48" height="352" rx="12" fill="#15803d" />
  <line x1="120" y1="120" x2="120" y2="392" stroke="#ffffff" stroke-width="4" stroke-dasharray="10 10" />

  <!-- Rupee Symbol in Center -->
  <circle cx="280" cy="220" r="70" fill="url(#gold)" />
  <text x="280" y="248" font-family="Arial, sans-serif" font-size="90" font-weight="bold" fill="#ffffff" text-anchor="middle">₹</text>

  <!-- Ledger Lines -->
  <line x1="180" y1="325" x2="380" y2="325" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
  <line x1="180" y1="360" x2="380" y2="360" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
  <line x1="180" y1="395" x2="310" y2="395" stroke="#16a34a" stroke-width="6" stroke-linecap="round" />
</svg>
